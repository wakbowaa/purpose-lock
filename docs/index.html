<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Purpose Lock</title><style>:root{--b:#071411;--m:#77f2bd;--p:#eaf7ef;--r:#ff6b59}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--p);font:15px Arial}.top{padding:22px 4vw;display:flex;justify-content:space-between;font:700 11px monospace}.top button,.btn{border:1px solid var(--m);background:transparent;color:var(--m);padding:12px;font:bold 11px monospace}.vault{max-width:1100px;margin:4vh auto;padding:4vw;border:1px solid #77f2bd55;background:radial-gradient(circle at 70% 20%,#173e31,#071411 55%)}h1{font-size:clamp(60px,10vw,130px);line-height:.75;letter-spacing:-.07em;margin:30px 0}.intro{max-width:560px;font-size:19px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:45px}.field{display:grid;gap:7px}.wide{grid-column:1/-1}label{font:bold 10px monospace;color:var(--m)}input,textarea{background:#0b211b;border:1px solid #3c6857;color:white;padding:13px;font:14px monospace}textarea{min-height:100px}.tokens{display:flex;gap:8px;flex-wrap:wrap}.tokens input{flex:1;min-width:180px}.actions{display:flex;gap:10px;margin-top:25px}.primary{background:var(--m);color:var(--b)}.recipient{border-color:var(--r);color:var(--r)}#status{margin-top:18px;border-left:4px solid var(--m);padding:14px;background:#ffffff0b;font:12px monospace}.results{display:grid;gap:8px;margin-top:20px}.result{padding:15px;border:1px solid #406457;display:flex;justify-content:space-between}.ALLOWED{color:var(--m)}.BLOCKED,.AMBIGUOUS{color:var(--r)}@media(max-width:700px){.vault{margin:0}.grid{grid-template-columns:1fr}.wide{grid-column:1}h1{font-size:70px}}</style></head><body><header class="top"><b>PURPOSE LOCK / CAPABILITY VAULT</b><button id="connect">CONNECT WALLET</button></header><main class="vault"><small>ONE ASSET · ONE RECIPIENT · EXPLICIT SCOPE</small><h1>Lock the<br>purpose.</h1><p class="intro">Publish what a dataset may become. The named recipient proposes concrete operations; validators allow only the uses that fit inside the frozen charter.</p><div class="grid"><div class="field"><label>LOCK ID</label><input id="id"></div><div class="field"><label>NAMED RECIPIENT ADDRESS</label><input id="recipient" placeholder="0x..."></div><div class="field wide"><label>ASSET LABEL</label><input id="asset" placeholder="Customer interview archive"></div><div class="field wide"><label>PURPOSE</label><textarea id="purpose" placeholder="Explain the narrow reason access is granted."></textarea></div><div class="field"><label>ALLOWED USES · ONE PER LINE</label><textarea id="allowed"></textarea></div><div class="field"><label>FORBIDDEN USES · ONE PER LINE</label><textarea id="forbidden"></textarea></div><div class="field wide"><label>RECIPIENT OPERATIONS · ONE PER LINE</label><textarea id="ops"></textarea></div></div><div class="actions"><button class="btn primary" id="publish">1 · PUBLISH CHARTER</button><button class="btn recipient" id="request">2 · FIX REQUEST</button><button class="btn" id="judge">3 · ADJUDICATE</button></div><div id="status">Connect the steward wallet to begin.</div><section id="results" class="results"></section></main><script type="module">import{createAccount,createClient}from'https://esm.sh/genlayer-js@1.1.8';import{studionet}from'https://esm.sh/genlayer-js@1.1.8/chains';const A='0xAB1E0D3E748ac32e83a25b07A98EbfFBb78Cb55C',E='https://studio.genlayer.com/api',$=s=>document.querySelector(s),reader=createClient({chain:studionet,endpoint:E,account:createAccount()});let c;$('#id').value='LOCK-'+Date.now().toString().slice(-8);const lines=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean),note=x=>$('#status').textContent=x;async function connect(){const[a]=await ethereum.request({method:'eth_requestAccounts'});if(String(await ethereum.request({method:'eth_chainId'})).toLowerCase()!=='0xf22f')await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0xf22f'}]});c=createClient({chain:studionet,endpoint:E,account:a,provider:ethereum});$('#connect').textContent=a.slice(0,6)+'…'+a.slice(-4);note('Wallet connected.')}$('#connect').onclick=()=>connect().catch(e=>note(e.message));async function send(fn,args){if(!c)await connect();const h=await c.writeContract({address:A,functionName:fn,args,value:0n});note('SUBMITTED '+h.slice(0,14)+'… · WAITING FINALIZED');await c.waitForTransactionReceipt({hash:h,status:'FINALIZED',retries:180,interval:5000});note('FINALIZED · '+fn);return h}$('#publish').onclick=()=>send('publish',[$('#id').value,$('#recipient').value,$('#asset').value,$('#purpose').value,JSON.stringify(lines('#allowed')),JSON.stringify(lines('#forbidden'))]).catch(e=>note(e.message));$('#request').onclick=()=>send('request',[$('#id').value,JSON.stringify(lines('#ops'))]).catch(e=>note(e.message));$('#judge').onclick=async()=>{try{await send('adjudicate',[$('#id').value]);const r=await reader.readContract({address:A,functionName:'get_lock',args:[$('#id').value]});$('#results').innerHTML=r.verdicts.map(x=>'<div class="result"><span>'+x.operation+'</span><b class="'+x.status+'">'+x.status+'</b></div>').join('');note(r.grant+' · '+r.state)}catch(e){note(e.message)}};</script></body></html>
